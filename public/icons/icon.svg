
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22c55e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with 3D tactile edge -->
  <rect x="20.48" y="20.48" width="471.04" height="471.04" rx="128" fill="#0d0d0d" />
  <rect x="20.48" y="20.48" width="471.04" height="450.56" rx="128" fill="url(#bgGrad)" stroke="#2e2e2e" stroke-width="10.24" />

  <!-- Inner Plate Ring -->
  <circle cx="256" cy="245.76" r="153.6" fill="#181818" stroke="#282828" stroke-width="10.24" filter="url(#glow)"/>
  
  <!-- Food / Cloche / Bowl Motif in Neon Green -->
  <!-- Cloche Dome -->
  <path d="M 153.6 266.24 C 153.6 174.08 358.4 174.08 358.4 266.24 Z" fill="url(#greenGrad)" />
  <!-- Cloche Handle -->
  <circle cx="256" cy="158.72" r="23.04" fill="#4ade80" />
  <!-- Plate Base -->
  <rect x="133.12" y="276.48" width="245.76" height="30.72" rx="15.36" fill="#15803d" />
  <rect x="133.12" y="266.24" width="245.76" height="30.72" rx="15.36" fill="url(#greenGrad)" />

  <!-- Steam waves -->
  <path d="M 215.04 122.88 Q 230.4 102.4 215.04 81.92" stroke="#4ade80" stroke-width="12.8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 296.96 122.88 Q 312.32 102.4 296.96 81.92" stroke="#4ade80" stroke-width="12.8" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Tactile Bottom Indicator Pill -->
  <rect x="184.32" y="368.64" width="143.36" height="40.96" rx="20.48" fill="#22c55e" opacity="0.9"/>
  <circle cx="215.04" cy="389.12" r="10.24" fill="#ffffff" />
  <rect x="240.64" y="381.44" width="61.44" height="15.36" rx="7.68" fill="#ffffff" />
</svg>
